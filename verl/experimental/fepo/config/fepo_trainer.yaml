# Single-GPU experimental FEPO defaults for a 96GB Blackwell-class GPU.
model_id: Qwen/Qwen2.5-1.5B-Instruct
train_dataset: zhuzilin/dapo-math-17k
train_dataset_config: default
train_split: train
train_max_samples: -1
eval_datasets:
  - math-ai/math500
  - math-ai/olympiadbench
  - math-ai/amc23
  - math-ai/aime24
  - math-ai/aime25
  - math-ai/aime26
eval_split: test
eval_max_samples: -1
output_dir: checkpoints/fepo/qwen25_1_5b
seed: 42
device: cuda
dtype: bfloat16
reference_mode: disabled_adapter
solver_adapter_name: solver
failure_adapter_name: failure
lora_r: 128
lora_alpha: 256
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
num_generations: 8
train_prompt_batch_size: 4
gradient_accumulation_steps: 2
max_optimizer_steps: 3000
max_model_len: 4096
max_response_tokens: 2048
temperature: 1.0
top_p: 0.95
eval_temperature: 1.0
eval_top_p: 0.95
learning_rate: 5.0e-6
failure_learning_rate: 1.25e-6
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.99
max_grad_norm: 1.0
clip_eps: 0.2
fepo_escape_alpha: 0.01
fepo_reference_beta: 0.03
token_log_ratio_clip: 8.0
eval_every_steps: 20
eval_generations: 8
eval_batch_size: 4
generation_backend: vllm_openai
vllm_host: 127.0.0.1
vllm_port: 8000
vllm_base_model_name: qwen-base
vllm_lora_name: train_lora
launch_vllm: true
vllm_gpu_memory_utilization: 0.45
loss_micro_batch_size: 8
max_token_per_micro_batch: 8192
use_token_based_batching: false
console_sample_count: 3
vllm_client_concurrency: 1
vllm_max_num_seqs: 32
vllm_attention_backend: FLASHINFER
request_timeout_s: 240
keep_last_adapters: 1
checkpoint_every_steps: 1
keep_last_checkpoints: 3
resume_mode: auto
resume_from_path: null
project_name: failure-escape
experiment_name: qwen25-fepo-single-gpu
logger:
  - console
  - wandb
