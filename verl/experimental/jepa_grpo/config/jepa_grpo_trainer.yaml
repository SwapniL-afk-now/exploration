# Base config for all JEPA-GRPO experiments.
# Override fields with per-model YAML files or CLI flags.
# See JEPA-GRPO-Equation.md for algorithm details.

model_id: Qwen/Qwen2.5-1.5B-Instruct
train_dataset: zhuzilin/dapo-math-17k
train_dataset_config: default
train_split: train
train_max_samples: -1
eval_datasets:
  - math-ai/math500
  - math-ai/olympiadbench
  - math-ai/amc23
  - math-ai/aime24
  - math-ai/aime25
  - math-ai/aime26
eval_split: test
eval_max_samples: -1

output_dir: checkpoints/jepa_grpo/qwen25_1_5b
seed: 42
device: cuda
dtype: bfloat16
reference_mode: disabled_adapter

lora_adapter_name: policy
lora_r: 128
lora_alpha: 256
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

num_generations: 8
train_prompt_batch_size: 4
gradient_accumulation_steps: 2
max_optimizer_steps: 3000
max_model_len: 4096
max_response_tokens: 2048
temperature: 1.0
top_p: 0.95
eval_temperature: 1.0
eval_top_p: 0.95

learning_rate: 5.0e-6
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.99
max_grad_norm: 1.0

clip_eps: 0.2
token_log_ratio_clip: 8.0

# ---- JEPA hyperparameters (LeJEPA defaults from arXiv 2511.08544 §6.1) ----
# alpha: THE only tuning knob; sweep {0.01, 0.05, 0.1, 0.2, 0.5}
alpha: 0.1

# Fixed LeJEPA defaults — do not change without reading §6.1 ablations
lambda_: 0.05         # SIGReg vs align mixing; stable across 1-2 orders of magnitude
M: 1024               # SIGReg random projection directions; 512 is competitive
n_freq: 17            # Epps-Pulley quadrature points; <0.3% variation from 5 to 41
t_min: -5.0           # Frequency range; safe superset, outside range CF is negligible
t_max: 5.0
epps_pulley_s: 1.0    # Gaussian kernel bandwidth

embed_micro_batch_size: 16
min_pool_size_for_sigreg: 32   # Skip JEPA if pool is smaller (Epps-Pulley needs >= 32)

# ---- View prompts ----
cot_system_prompt: >
  You are a careful mathematical problem solver.
  Reason step by step and put the final answer in \boxed{}.
cot_user_suffix: "Solve the problem. Show your reasoning and put the final answer in \\boxed{}."
code_system_prompt: >
  You are an expert programmer.
  Write Python code to solve the math problem.
  At the end, print the final answer on its own line in the format: \boxed{answer}.
  Wrap your code in ```python\n...\n```.
code_user_suffix: >
  Solve the problem by writing Python code.
  The last line of output must be the final answer in the format \boxed{answer},
  for example: print(f"\\boxed{{{result}}}").
  Wrap your solution in ```python\n...\n```.

# ---- vLLM ----
generation_backend: vllm_openai
vllm_host: 127.0.0.1
vllm_port: 8000
vllm_base_model_name: qwen-base
vllm_lora_name: train_lora
launch_vllm: true
vllm_gpu_memory_utilization: 0.45
vllm_max_num_seqs: 32
vllm_client_concurrency: 1
vllm_attention_backend: FLASHINFER
vllm_sleep_enabled: true
vllm_sleep_level: 1
vllm_sleep_timeout_s: 120
vllm_wake_timeout_s: 180
request_timeout_s: 240
actor_attention_impl: flash_attention_2
keep_last_adapters: 1

loss_micro_batch_size: 8
max_token_per_micro_batch: 8192
use_token_based_batching: false
console_sample_count: 3

eval_every_steps: 10
eval_generations: 16
eval_batch_size: 16

checkpoint_every_steps: 20
keep_last_checkpoints: 3
resume_mode: auto
resume_from_path: null

project_name: verl_jepa_grpo_dapo_math
experiment_name: qwen25-jepa-grpo-single-gpu
logger:
  - console
  - wandb
