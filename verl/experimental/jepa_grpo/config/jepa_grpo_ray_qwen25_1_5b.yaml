# JEPA-GRPO Ray | Qwen2.5-1.5B-Instruct | single GPU
# This is merged on top of jepa_grpo_ray_trainer.yaml in main_ray.py.
defaults:
  - jepa_grpo_ray_trainer
  - _self_

actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-1.5B-Instruct

  rollout:
    gpu_memory_utilization: 0.50
    max_num_seqs: 512
    n: 8
    tensor_model_parallel_size: 1

  actor:
    ppo_mini_batch_size: 64
    ppo_max_token_len_per_gpu: 16384

data:
  train_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 2048

jepa:
  alpha: 0.1
  embed_micro_batch_size: 8

trainer:
  n_gpus_per_node: 1
  nnodes: 1
  total_training_steps: 3000
  experiment_name: qwen25_1_5b_jepa_grpo_ray
